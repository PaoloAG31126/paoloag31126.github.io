<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Random Password Generator</title>
<style>
body {font-family: Arial, sans-serif; margin: 2rem;}
label {display:block; margin-top: 1rem;}
button {margin-top: 1rem; padding: 0.5rem 1rem;}
#password {font-weight: bold; margin-top: 1rem;}
</style>
</head>
<body>
<h1>Random Password Generator</h1>
<label>Length:
<input type="number" id="length" value="12" min="4" max="64">
</label>
<button id="generate">Generate</button>
<div id="password"></div>
<script>
const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+{}:"<>?';
function generatePassword(len){
  let p='';
  for(let i=0;i<len;i++){
    p+=chars.charAt(Math.floor(Math.random()*chars.length));
  }
  return p;
}
document.getElementById('generate').addEventListener('click',()=>{
  const len=parseInt(document.getElementById('length').value)||12;
  const pw=generatePassword(len);
  document.getElementById('password').textContent='Password: '+pw;
});
</script>
</body>
</html>
